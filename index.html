<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advancedwk2homework</title>
    <script src="https://unpkg.com/axios@1.1.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="current-weather-container">
    <header>
        <form id="search-form">
            <input
                type="text" class="city-input" placeholder="Enter a city" required> 
                <input type="submit" value="Search" class="search-button">
        </form>
        </header>
    <main>
    <div class="current-city">
        <h1 id="city">Paris</h1>
        <p id="current-day"> Monday 13.06, cloudy <br/> Humidity: <strong class="humidity">87%</strong>, Wind: <strong class="speed">7.2Km/h </strong> 
        </p>
    <div class="current-weather">
        <span class="current-temperature-icon">
            🌥️ 
        </span>
        <span class="current-temperature-value">
            23
        </span>
        <span class="current-temperature-unit">
            oC
        </span>
    </div>
    </main>
    <footer><p>This project was coded by
        <a href="https://github.com/mariefish999" target ="blank">Marie Fisher</a> and is on <a href="https://github.com/mariefish999/my-weather-app" target ="blank">Github</a> and hosted on <a href="https://lambent-pothos-2d57f8.netlify.app/" target="blank">Netlify</a></p>
    </footer>
    </div>
    </body>
    <script src ="jscript.js"></script>
</html>
